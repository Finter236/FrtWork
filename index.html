<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault — зашифрованное хранилище</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: 'Onest', system-ui, sans-serif; background: #07080d; color: #e7e9f3; }
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .aurora i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); opacity: .32; animation: drift 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { background: #5b5bff; top: -15%; left: -10%; }
  .aurora i:nth-child(2) { background: #00c2a8; bottom: -20%; right: -10%; animation-duration: 28s; }
  .aurora i:nth-child(3) { background: #c04bff; top: 30%; left: 45%; width: 30vmax; height: 30vmax; opacity: .18; animation-duration: 34s; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  .glass { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .field { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1); border-radius: .75rem; padding: .7rem .9rem; width: 100%; outline: none; transition: border-color .2s, box-shadow .2s; }
  .field:focus { border-color: #7c83ff; box-shadow: 0 0 0 3px rgba(124,131,255,.25); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: .75rem; padding: .65rem 1.1rem; font-weight: 600; transition: transform .15s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn-p { background: linear-gradient(135deg, #6366ff, #00b8a5); color: #fff; }
  .btn-p:hover { filter: brightness(1.12); }
  .btn-g { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }
  .btn-g:hover { background: rgba(255,255,255,.12); }
  .card { transition: transform .2s, border-color .2s; }
  .card:hover { transform: translateY(-3px); border-color: rgba(124,131,255,.5); }
  .chip { padding: .35rem .85rem; border-radius: 999px; font-size: .85rem; border: 1px solid rgba(255,255,255,.12); transition: all .2s; white-space: nowrap; }
  .chip.on { background: #6366ff; border-color: #6366ff; color: #fff; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .drop.over { border-color: #7c83ff; background: rgba(124,131,255,.12); }
  .rise { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } }
  :focus-visible { outline: 2px solid #9aa0ff; outline-offset: 2px; }
</style>
</head>
<body class="min-h-screen">
<div class="aurora"><i></i><i></i><i></i></div>

<!-- Экран блокировки -->
<main id="lock" class="min-h-screen grid place-items-center p-4">
  <form id="lockForm" class="glass rise w-full max-w-sm rounded-3xl p-8 text-center">
    <div class="mx-auto mb-5 grid h-14 w-14 place-items-center rounded-2xl bg-white/10"><i data-lucide="lock-keyhole"></i></div>
    <h1 class="text-2xl font-bold">Закрытое хранилище</h1>
    <p id="lockHint" class="mt-2 mb-6 text-sm text-white/55">Введите пароль, чтобы расшифровать каталог.</p>
    <input id="pw" type="password" class="field text-center" placeholder="Пароль" autocomplete="current-password" autofocus>
    <p id="lockErr" class="mt-3 hidden text-sm text-rose-400"></p>
    <button id="lockBtn" class="btn btn-p mt-5 w-full">Открыть</button>
  </form>
</main>

<!-- Приложение -->
<div id="app" class="hidden mx-auto max-w-6xl p-4 sm:p-8">
  <header class="mb-8 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3"><i data-lucide="vault"></i><b class="text-xl">Vault</b></div>
    <nav class="flex gap-2">
      <button class="btn btn-g tab" data-tab="catalog"><i data-lucide="layout-grid" class="h-4 w-4"></i>Каталог</button>
      <button class="btn btn-g tab" data-tab="admin"><i data-lucide="shield" class="h-4 w-4"></i>Админ</button>
      <button id="lockNow" class="btn btn-g" title="Заблокировать"><i data-lucide="log-out" class="h-4 w-4"></i></button>
    </nav>
  </header>

  <section id="catalog">
    <div class="relative mb-4"><i data-lucide="search" class="absolute left-3 top-3.5 h-4 w-4 text-white/40"></i>
      <input id="q" class="field pl-10" placeholder="Поиск по названию, описанию, категории"></div>
    <div id="chips" class="mb-6 flex gap-2 overflow-x-auto pb-1"></div>
    <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <section id="admin" class="hidden">
    <div class="grid gap-6 lg:grid-cols-2">
      <div class="glass rounded-2xl p-5 space-y-3">
        <h2 class="font-semibold">Подключение к GitHub</h2>
        <div class="grid grid-cols-3 gap-2">
          <input id="cOwner" class="field" placeholder="Владелец">
          <input id="cRepo" class="field" placeholder="Репозиторий">
          <input id="cBranch" class="field" placeholder="Ветка" value="main">
        </div>
        <input id="pat" type="password" class="field" placeholder="Personal Access Token (хранится только в памяти)" autocomplete="off">
        <div id="dirty" class="hidden rounded-xl bg-amber-400/10 p-3 text-sm text-amber-200">Хранилище ещё не создано. Нажмите «Сохранить базу» — она появится в репозитории.
          <button id="saveDb" class="btn btn-g mt-2 w-full">Сохранить базу</button></div>
      </div>

      <div class="glass rounded-2xl p-5 space-y-3">
        <h2 class="font-semibold">Новый файл</h2>
        <label id="drop" class="drop grid cursor-pointer place-items-center rounded-xl border-2 border-dashed border-white/20 p-6 text-center transition">
          <input id="file" type="file" class="hidden">
          <i data-lucide="upload-cloud" class="mb-2 h-7 w-7 text-white/60"></i>
          <span id="dropTxt" class="text-sm text-white/60">Перетащите файл или нажмите для выбора (до 50 МБ)</span>
        </label>
        <input id="fName" class="field" placeholder="Название">
        <textarea id="fDesc" class="field" rows="2" placeholder="Описание"></textarea>
        <input id="fCat" class="field" placeholder="Категория / теги">
        <button id="upBtn" class="btn btn-p w-full"><i data-lucide="shield-check" class="h-4 w-4"></i>Зашифровать и загрузить</button>
        <div id="upBar" class="hidden h-1.5 overflow-hidden rounded bg-white/10"><div class="h-full w-1/3 animate-pulse bg-indigo-400"></div></div>
      </div>
    </div>
    <h2 class="mb-3 mt-8 font-semibold">Файлы в хранилище</h2>
    <div id="adminList" class="space-y-2"></div>
  </section>
</div>

<!-- Прогресс скачивания -->
<div id="dl" class="fixed inset-0 z-50 hidden place-items-center bg-black/60 p-4 backdrop-blur-sm">
  <div class="glass rise w-full max-w-sm rounded-2xl p-6">
    <p class="mb-1 text-sm text-white/50" id="dlStage">Загрузка</p>
    <p class="mb-4 truncate font-semibold" id="dlName"></p>
    <div class="h-2 overflow-hidden rounded bg-white/10"><div id="dlBar" class="h-full w-0 bg-gradient-to-r from-indigo-400 to-teal-300 transition-[width]"></div></div>
    <p id="dlPct" class="mt-2 text-right text-sm text-white/60">0%</p>
  </div>
</div>

<div id="toast" class="glass fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-xl px-4 py-2 text-sm"></div>

<script src="crypto.js"></script>
<script src="app.js"></script>
</body>
</html>
